[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-investigation-assistant"
version = "0.1.0"
description = "Read-only, evidence-grounded incident investigation assistant"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.66.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
